<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>DisConnect 4</title>
    <link rel="stylesheet" href="/disconnect4/jouer/play.css" />
    <link rel="stylesheet" href="/public/style.css" />
    <link rel="icon" href="/public/assets/favicon.ico" />
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"
        integrity="sha384-kzavj5fiMwLKzzD1f8S7TeoVIEi7uKHvbTA3ueZkrzYq75pNQUiUi6Dy98Q3fxb0"
        crossorigin="anonymous"></script>
</head>
<body>
    <div id="head-tracker"></div>
    <div id="face-detection-popup" class="popup">
        <div class="popup-body">
            <h3 id="face-detection-title">
                Détection du visage
            </h3>
            <div class="inline-options">
                <button id="activate-face-detection" class="popup-option" onclick="activateFacialDetection();">
                    Activer</button>
                <button id="deactivate-face-detection" class="popup-option" onclick="deactivateFacialDetection();">
                    Désactiver</button>
            </div>
            <p>Sensibilité : <span id="sensibility-value">XX</span> %</p>
            <input type="range" min="0" max="100" id="sensibility-range" value="17" />
            <p>Durée d'un clin d'œil : <span id="blink-value">XX</span> s</p>
            <input type="range" min="0" max="1" id="blink-range" value=".25" step="0.1" />
            <div class="inline-options">
                <button onclick="toDefaultParameters();" class="popup-option">Retour aux paramètres par défaut</button>
                <button onclick="closeDetectionPopup();" class="popup-option">Confirmer</button>
            </div>
        </div>
        <div class="popupBackground"></div>
    </div>
    <div id="confirmation-popup" class="popup">
        <div class="popup-body">
            <h3 class="confirmation-popup-title">
                Êtes-vous sûr de vouloir abandonner ?
            </h3>
            <div class="inline-options">
                <button class="popup-option" onclick="validateResign(false);">Non</button>
                <button class="popup-option" onclick="validateResign(true);">Oui</button>
            </div>
        </div>
        <div class="popupBackground">
        </div>
    </div>
    <div id="state-popup" class="popup">
        <div class="popup-body">
            <h3 id="state-popup-title">
                Partie en cours
            </h3>
            <div class="inline-options">
                <button class="popup-option" onclick="hideAll();">Fermer</button>
                <button class="popup-option" onclick="resetGame();hideAll();">Rejouer !</button>
                <button class="popup-option" onclick="goToMenu();">Retour au menu !</button>
            </div>
        </div>
        <div class="popupBackground">
        </div>
    </div>
    <div id="refused-popup" class="popup">
        <div class="popup-body">
            <h3 class="refused-popup-title">
                Impossible de jouer à cette partie !
            </h3>
            <p id="refused-popup-text">
                L'identifiant de la partie est incorrect !
            </p>
            <div class="inline-options">
                <button class="popup-option" onclick="goToMenu();">Retour au menu</button>
                <button class="popup-option" onclick="watch();">Aller regarder</button>
            </div>
        </div>
        <div class="popupBackground">
        </div>
    </div>
    <div id ='content'>
    <img class="background" src="/public/assets/background.svg" alt=""/>
    <div id="header">
            <a href="/jeux/?g=disconnect4" id="return" aria-label="Retourner au portail">
                <img src="/public/assets/return.svg" alt="return" />
            </a>
            <button id="toggle-facial-button" class="facial-active" aria-label="Activer/Désactiver le suivi du visage" onclick="displayFacialDetectionPopup(event);">
                <img id="toggle-face-button-image" src="/public/assets/eye-open.svg" alt="🔴" />
            </button>
            <button id="toggle-vocal-button" class="vocal-active" aria-label="Activer/Désactiver la commande vocale"
                onclick="toggleVocalMode(event);">
                <img id="toggle-vocal-button-image" src="/public/assets/mic-on.svg" alt="🎙️" />
            </button>
            <a href="/rules/?g=disconnect4" id="rules-button" aria-label="Voir les règles du jeu">
                <img id="rules-image" src="/public/assets/rules.png" alt="Règles" />
             </a>
        </div>
    <div class='play-container'>
        <div class="board-container">
            <div id="div-button"></div>
            <div id="div-tab"></div>
        </div>
        <div class="side-panel">
            <a href="/">
                <img id="logo" src="/public/assets/paragames_logo.svg" alt="Logo ParaGames" />
            </a>
                <p id="game-id">
                    Partie : <span id="game-id-span"></span>
                </p>
                <div id="side">
                    Tour au bleu 🔵.
                </div>
                <div class="button-group">
                        <button class="modern-button icon-button" onclick="resetGame();" aria-label="Recommencer la partie">
                            <img src="/public/assets/reset.svg" alt="" class="button-icon" />
                            <span>Recommencer la partie</span>
                        </button>
                        <button id="undo-button" class="modern-button btn-danger" aria-label="Annuler le dernier coup" onclick="undo();">
                            Annuler le coup
                        </button>
                        <button class="modern-button btn-danger" aria-label="Abandonner la partie" onclick="resign();">
                            Abandonner la partie
                        </button>
                </div>
        </div>
    </div>
    </div>
    <video id="webcam" autoplay playsinline></video>
    <script src="/public/connect4board.js"></script>
    <script src="/disconnect4/jouer/play.js"></script>
    <script src="/public/voice/voice-disconnect4-play.js"></script>
    <script src="/public/head-tracking.js" type="module"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const focusPremierBouton = document.getElementById('btn_1');
            if (focusPremierBouton) {
                focusPremierBouton.focus();
            }
        });
    </script>
</body>

</html>
