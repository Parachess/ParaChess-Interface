<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        Parachess | Règles
    </title>
    <link rel="stylesheet" href="/public/style.css" />
    <link rel="icon" href="/public/assets/favicon.ico" />
    <script src="https://cdn.socket.io/4.8.3/socket.io.min.js"
        integrity="sha384-kzavj5fiMwLKzzD1f8S7TeoVIEi7uKHvbTA3ueZkrzYq75pNQUiUi6Dy98Q3fxb0"
        crossorigin="anonymous"></script>
</head>
<script>
    const keyPressed = {};
    let i = 0;
    window.addEventListener('keydown', e => {
            keyPressed[e.key] = true;

            if (keyPressed['Control'] && keyPressed['Alt']) {
                if (e.key === 'c') {
                    if (i === 0){
                        i = 1;
                        activateFacialDetection();
                    }
                    else{
                        i = 0;
                        deactivateFacialDetection();
                    }
                }
                else if (e.key === 'r') {
                    window.open(window.location.origin, '_self');
                } 
            }
        });

        window.addEventListener('keyup', e => {
            delete keyPressed[e.key];
        });      
</script>
<body data-voice-page="rules">
    <div id="head-tracker"></div>
    <div id="face-detection-popup" class="popup">
        <div class="popup-body">
            <h3 id="face-detection-title">
                Détection du visage
            </h3>
            <div class="inline-options">
                <button id="activate-face-detection" class="popup-option" onclick="activateFacialDetection();">
                    Activer</button>
                <button id="deactivate-face-detection" class="popup-option" onclick="deactivateFacialDetection();">
                    Désactiver</button>
            </div>
            <p>Sensibilité : <span id="sensibility-value">XX</span> %</p>
            <input type="range" min="0" max="100" id="sensibility-range" value="17" />
            <p>Durée d'un clin d'œil : <span id="blink-value">XX</span> s</p>
            <input type="range" min="0" max="1" id="blink-range" value=".25" step="0.1" />
            <div class="inline-options">
                <button onclick="toDefaultParameters();" class="popup-option">Retour aux paramètres par défaut</button>
                <button onclick="closeDetectionPopup();" class="popup-option">Confirmer</button>
            </div>
        </div>
        <div class="popupBackground"></div>
    </div>
    <div id="content">
        <div id="header">
            <a href="/jeux" id="return" aria-label="Retourner au menu">
                <img src="/public/assets/return.svg" alt="return" />
                <div class="voice-command-hint-button">
                    <img src="/public/assets/parler_blanc.png" alt="Parler">
                    <span>"retour"</span>
                </div>
            </a>
            <a href="/">
                <img id="logo" src="/public/assets/paragames_logo.svg" alt="Logo ParaGames" />
            </a>
            <button id="toggle-facial-button" class="facial-active" aria-label="Activer/Désactiver le suivi du visage"
                onclick="displayFacialDetectionPopup(event);">
                <img id="toggle-face-button-image" src="/public/assets/eye-open.svg" alt="🔴" />
            </button>
            <button id="toggle-vocal-button" class="vocal-active" aria-label="Activer/Désactiver la commande vocale"
                onclick="toggleVocalMode(event);">
                <img id="toggle-vocal-button-image" src="/public/assets/mic-on.svg" alt="🎙️" />
            </button>
        </div>
        <img class="background" src="/public/assets/background.svg" alt="" />


        <div class="panel" id="rules-content">
            <p style="text-align: center; margin-top: 40px;">Chargement des règles en cours...</p>
        </div>
    </div>
    <video id="webcam" autoplay playsinline></video>
    <script src="/public/head-tracking.js" type="module"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const game = urlParams.get('g') || 'parachess';
            
            const logo = document.getElementById('logo');
            if (game === 'disconnect4') {
                logo.src = '/public/assets/paragames.svg';
            } else {
                logo.src = '/public/assets/paragames_logo.svg';
            }

            // Déterminer l'URL de retour selon la provenance
            let returnUrl = null;
            let isGame = false;

            const fromParam = urlParams.get('from');
            if (fromParam) {
                try {
                    const parsed = new URL(fromParam, window.location.origin);
                    if (parsed.origin === window.location.origin) {
                        const path = parsed.pathname;
                        if (path.startsWith('/parachess/') || path.startsWith('/disconnect4/')) {
                            returnUrl = parsed.pathname + parsed.search;
                            isGame = true;
                        } else if (path.startsWith('/jeux')) {
                            returnUrl = parsed.pathname + parsed.search;
                        }
                    }
                } catch (e) {
                    if (fromParam.startsWith('/parachess/') || fromParam.startsWith('/disconnect4/')) {
                        returnUrl = fromParam;
                        isGame = true;
                    } else if (fromParam.startsWith('/jeux')) {
                        returnUrl = fromParam;
                    }
                }
            }

            if (!returnUrl && document.referrer) {
                try {
                    const refUrl = new URL(document.referrer);
                    if (refUrl.origin === window.location.origin) {
                        const path = refUrl.pathname;
                        if (path.startsWith('/parachess/') || path.startsWith('/disconnect4/')) {
                            returnUrl = refUrl.pathname + refUrl.search;
                            isGame = true;
                        } else if (path.startsWith('/jeux')) {
                            returnUrl = refUrl.pathname + refUrl.search;
                        }
                    }
                } catch (e) {}
            }

            const sessionKey = 'rules_return_url_' + game;
            if (returnUrl) {
                sessionStorage.setItem(sessionKey, JSON.stringify({ url: returnUrl, isGame }));
            } else {
                try {
                    const saved = JSON.parse(sessionStorage.getItem(sessionKey));
                    if (saved && saved.url) {
                        returnUrl = saved.url;
                        isGame = !!saved.isGame;
                    }
                } catch (e) {}
            }

            if (!returnUrl) {
                returnUrl = '/jeux?g=' + game;
            }

            const returnBtn = document.getElementById('return');
            if (returnBtn) {
                returnBtn.href = returnUrl;
                returnBtn.setAttribute('aria-label', isGame ? 'Retourner à la partie' : 'Retourner au menu');
            }

            try {
                const response = await fetch(`/public/rules/${game}.html`);
                if (response.ok) {
                    const html = await response.text();
                    document.getElementById('rules-content').innerHTML = html;
                } else {
                    document.getElementById('rules-content').innerHTML = "<h1>Erreur</h1><p>Impossible de charger les règles de ce jeu.</p>";
                }
            } catch (err) {
                document.getElementById('rules-content').innerHTML = "<h1>Erreur</h1><p>Impossible de charger les règles de ce jeu.</p>";
            }
        });
    </script>
    <script src="/public/voice-commands.js"></script>
</body>

</html>
